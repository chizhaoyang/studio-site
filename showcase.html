<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showcase – Crescendo Journey Music Studio</title>

  <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  <link rel="icon" type="image/png" sizes="512x512" href="/images/logo.png" />
  <link rel="stylesheet" href="/css/styles.css" />

</head>

<body>
  <header id="site-header"></header>

  <main class="section container">
    <h2 class="section-title section-title--center">Performances</h2>

    <div class="showcase-wrap">

      <!-- Gallery Card -->
      <section class="showcase-card" aria-labelledby="recitalMoments">
        <h3 id="recitalMoments">Recital&nbsp;Moments</h3>
        <div class="gallery">
          <img src="/images/recital1.png" alt="Student on stage">
          <img src="/images/recital2.png" alt="Duet performance">
          <img src="/images/recital3.png" alt="Piano ensemble">
          <!-- Add more photos as needed -->
        </div>
      </section>

      <!-- Video Card -->
      <section class="showcase-card" aria-labelledby="watchListen">
        <h3 id="watchListen">Watch&nbsp;&amp;&nbsp;Listen</h3>
        <div class="video-wrapper">
          <iframe src="https://www.youtube-nocookie.com/embed/VIDEO_ID?rel=0" title="Student performance" loading="lazy"></iframe>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="/js/injectIncludes.js?v=20260130_1" defer></script>
</body>
</html>
