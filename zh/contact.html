    <h1 class="section-title section-title--center">联系</h1>

    <div class="contact-wrap">

      <!-- ── Contact Form ─────────────────────── -->
      <section class="contact-card" aria-labelledby="msgUs">
        <h2 id="msgUs">给我们留言</h2>
        <form action="https://formspree.io/f/xldwjogd" method="POST" class="contact-form">
          <label class="visually-hidden" for="contactName">您的姓名</label>
          <input type="text"  id="contactName"  name="name"  placeholder="您的姓名" required />
          <label class="visually-hidden" for="contactEmail">邮箱地址</label>
          <input type="email" id="contactEmail" name="email" placeholder="邮箱地址" required />
          <label class="visually-hidden" for="contactPhone">电话（可选）</label>
          <input type="tel"   id="contactPhone" name="phone" placeholder="电话（可选）" />
          <label class="visually-hidden" for="contactMessage">请分享您的学习目标</label>
          <textarea id="contactMessage" name="message" rows="5" placeholder="请分享您的学习目标…"></textarea>
          <input type="text" name="_gotcha" class="honeypot" aria-hidden="true">
          <button type="submit">发送</button>
        </form>
      </section>

      <!-- ── Map & Details ─────────────────────── -->
      <section class="contact-card" aria-labelledby="findUs">
        <h2 id="findUs">地址</h2>
        <p class="contact-address"><strong>鼎艺音乐工作室</strong><br>655 Concord St, Framingham, MA&nbsp;01702</p>
        <iframe src="https://www.google.com/maps?q=655+Concord+St,+Framingham,+MA+01702&output=embed" title="655 Concord St, Framingham, MA 01702" loading="lazy"></iframe>

        <h3 class="contact-subtitle">保持联系</h3>

      <!-- ── 空档时间 ─────────────────────── -->
      <section class="contact-card" aria-labelledby="availability">
        <h2 id="availability">查看空档时间</h2>
        <p class="contact-address">下方日历显示可预约的空档时间，已标注的时段为已预订。请通过上方表单或电话/邮箱与我们联系以确认具体时间。</p>
