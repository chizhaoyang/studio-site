<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Crescendo Journey Music Studio</title>
  <meta name="description" content="Book a trial lesson or contact Crescendo Journey Music Studio in Framingham, MA. Call (508) 250-2272 or send us a message.">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  <link rel="icon" type="image/png" sizes="512x512" href="/images/logo.png" />

  <!-- Site-wide stylesheet -->
  <link rel="stylesheet" href="/css/styles.css" />

  <!-- Font Awesome & Iconify -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

</head>
<body>
  <header id="site-header"></header>

  <main id="main-content" class="section container">
    <h2 class="section-title section-title--center">Contact</h2>

    <div class="contact-wrap">

      <!-- ── Contact Form ─────────────────────── -->
      <section class="contact-card" aria-labelledby="msgUs">
        <h3 id="msgUs">Send&nbsp;Us&nbsp;a&nbsp;Message</h3>
        <form action="https://formspree.io/f/xldwjogd" method="POST" class="contact-form">
          <input type="text"  name="name"  placeholder="Your name" required />
          <input type="email" name="email" placeholder="Email address" required />
          <input type="tel"   name="phone" placeholder="Phone (optional)" />
          <textarea name="message" rows="5" placeholder="Tell us about your goals…"></textarea>
          <input type="text" name="_gotcha" class="honeypot" aria-hidden="true">
          <button type="submit">Send&nbsp;Message</button>
        </form>
      </section>

      <!-- ── Map & Details ─────────────────────── -->
      <section class="contact-card" aria-labelledby="findUs">
        <h3 id="findUs">Find&nbsp;Us</h3>
        <p class="contact-address"><strong>Crescendo Journey Music Studio</strong><br>655 Concord St, Framingham, MA&nbsp;01702</p>
        <iframe src="https://www.google.com/maps?q=655+Concord+St,+Framingham,+MA+01702&output=embed" title="655 Concord St, Framingham, MA 01702" loading="lazy"></iframe>

        <h3 class="contact-subtitle">Stay&nbsp;Connected</h3>
        <ul class="contact-list">
          <li><i class="fa-solid fa-envelope icon-email"></i>Email:&nbsp;<a href="mailto:crescendojourney0821@gmail.com">crescendojourney0821@gmail.com</a></li>
          <li><i class="fa-solid fa-phone icon-phone"></i>Phone:&nbsp;<a href="tel:+15082502272">(508)&nbsp;250-2272</a></li>

          <!-- COLORED SOCIAL ICONS -->
          <!-- <li><i class="fa-brands fa-weixin icon-wechat"></i>WeChat:&nbsp;<span>yourWeChatID</span></li> -->
          <!-- <li><span class="iconify icon-xhs" data-icon="simple-icons:xiaohongshu"></span>Red&nbsp;Note:&nbsp;<span>yourXHS-ID</span></li> -->
          <!-- <li><i class="fa-brands fa-instagram icon-instagram"></i>Instagram:&nbsp;<a href="https://instagram.com/yourstudio" target="_blank" rel="noopener">@yourstudio</a></li> -->
          <!-- <li><i class="fa-brands fa-youtube icon-youtube"></i>YouTube:&nbsp;<a href="https://youtube.com/yourchannel" target="_blank" rel="noopener">/yourchannel</a></li> -->
        </ul>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Shared header/footer injection -->
  <script src="/js/injectIncludes.js?v=20260130_1" defer></script>
</body>
</html>
